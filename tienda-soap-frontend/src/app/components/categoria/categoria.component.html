<div class="container mt-4">
  <h2>Categorías</h2>
  <p class="text-muted">Servicio consumido: <strong>SOAP</strong> (IProductoService)</p>

  <mat-form-field appearance="fill" class="w-100">
    <mat-label>Buscar</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Buscar categoría...">
  </mat-form-field>

  <div class="table-responsive">
    <table mat-table [dataSource]="categoriasFiltradas" class="mat-elevation-z8 w-100">
      <ng-container matColumnDef="idCategoria">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let c">{{ c.idCategoria }}</td>
      </ng-container>
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
      </ng-container>
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let c">{{ c.descripcion }}</td>
      </ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let c">{{ c.estado ? 'Activo' : 'Inactivo' }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="mostrarColumnas"></tr>
      <tr mat-row *matRowDef="let row; columns: mostrarColumnas;"></tr>
    </table>
  </div>
</div>
